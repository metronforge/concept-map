name: Examples and layout comparison
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/comparison/**"
      - "examples/**"
      - "src/layout/**"
      - "src/schema*"
      - "src/schema/**"
      - "src/render/**"
      - "css/**"
      - "test/fixtures/**"
      - "package*.json"
      - ".github/workflows/comparison.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparison-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run comparison:build
      - uses: actions/upload-artifact@v4
        with:
          name: layout-comparison
          path: comparison-dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          path: comparison-dist/
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy examples and comparison
        id: deployment
        uses: actions/deploy-pages@v4
