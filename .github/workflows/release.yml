name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; if(process.env.RELEASE_TAG !== "v"+p.version) throw new Error("Release tag must match package version")'
      - run: npm publish --access public
